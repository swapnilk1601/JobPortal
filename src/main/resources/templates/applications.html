<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications - JobPortal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .logo {
            font-size: 27px;
            font-weight: 700;
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        nav a {
            text-decoration: none;
            color: #334155;
            font-size: 15px;
            font-weight: 500;
        }

        nav a:hover {
            color: #2563eb;
        }

        .logout-btn {
            color: #dc2626 !important;
            cursor: pointer;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 86%;
            max-width: 1100px;
            margin: 50px auto;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: 34px;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .page-header p {
            color: #64748b;
            font-size: 15px;
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 25px;
            min-width: 180px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
        }

        .summary-card h2 {
            color: #2563eb;
            font-size: 27px;
            margin-bottom: 5px;
        }

        .summary-card p {
            color: #64748b;
            font-size: 13px;
        }


        /* =========================
           APPLICATIONS
        ========================= */

        #applications-container {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(320px, 1fr)
            );
            gap: 22px;
        }


        /* =========================
           APPLICATION CARD
        ========================= */

        .application-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            transition: 0.25s;
        }

        .application-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.09);
        }

        .application-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }

        .job-icon {
            width: 48px;
            height: 48px;
            background: #eff6ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .application-card h2 {
            color: #1e293b;
            font-size: 20px;
            margin-bottom: 6px;
        }

        .company {
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
        }


        /* =========================
           JOB DETAILS
        ========================= */

        .details {
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .detail-label {
            color: #64748b;
        }

        .detail-value {
            color: #334155;
            font-weight: 600;
            text-align: right;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 13px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 60px 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            color: #334155;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #64748b;
            margin-bottom: 22px;
        }

        .browse-btn {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .browse-btn:hover {
            background: #1d4ed8;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            color: #64748b;
            padding: 50px;
            grid-column: 1 / -1;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            nav {
                padding: 16px 5%;
            }

            .nav-links {
                gap: 14px;
            }

            nav a {
                font-size: 13px;
            }

            .container {
                width: 90%;
                margin: 35px auto;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .summary {
                flex-wrap: wrap;
            }

            .summary-card {
                flex: 1;
                min-width: 140px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav>

    <div class="logo">
        JobPortal
    </div>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/jobs">
            Jobs
        </a>

        <a href="/applications">
            My Applications
        </a>

        <a
                href="#"
                class="logout-btn"
                onclick="logout(); return false;">

            Logout

        </a>

    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- Header -->

    <div class="page-header">

        <h1>
            My Applications
        </h1>

        <p>
            Track the jobs you have applied for.
        </p>

    </div>


    <!-- Summary -->

    <div class="summary">

        <div class="summary-card">

            <h2 id="totalApplications">
                0
            </h2>

            <p>
                Total Applications
            </p>

        </div>

    </div>


    <!-- Applications -->

    <div id="applications-container">

        <div class="loading">
            Loading applications...
        </div>

    </div>

</div>


<script>


    // =========================
    // GET LOGGED-IN USER
    // =========================

    const loggedInUser =
        JSON.parse(
            localStorage.getItem("loggedInUser")
        );


    // =========================
    // CHECK LOGIN
    // =========================

    if (!loggedInUser) {

        alert("Please login first.");

        window.location.href =
            "/login";

    } else {

        loadApplications();

    }


    // =========================
    // LOAD APPLICATIONS
    // =========================

    function loadApplications() {

        /*
         * userId is included for compatibility,
         * but the backend now ignores it and
         * uses the authenticated session user.
         */

        const applicationsUrl =
            `/api/applications?userId=${loggedInUser.id}`;


        Promise.all([

            fetch(applicationsUrl)
                .then(response => {

                    if (!response.ok) {
                        throw new Error(
                            "Unable to load applications"
                        );
                    }

                    return response.json();

                }),

            fetch("/api/jobs")
                .then(response => {

                    if (!response.ok) {
                        throw new Error(
                            "Unable to load jobs"
                        );
                    }

                    return response.json();

                })

        ])

            .then(([applications, jobs]) => {

                const container =
                    document.getElementById(
                        "applications-container"
                    );


                container.innerHTML = "";


                // Update total

                document.getElementById(
                    "totalApplications"
                ).innerText =
                    applications.length;


                // No applications

                if (applications.length === 0) {

                    container.innerHTML = `

                        <div class="empty-state">

                            <div class="empty-icon">
                                📄
                            </div>

                            <h2>
                                No Applications Yet
                            </h2>

                            <p>
                                You haven't applied for any jobs yet.
                                Start exploring opportunities today.
                            </p>

                            <a
                                href="/jobs"
                                class="browse-btn">

                                Browse Jobs

                            </a>

                        </div>

                    `;

                    return;
                }


                // Display applications

                applications.forEach(application => {

                    const job =
                        jobs.find(
                            j => j.id === application.jobId
                        );


                    container.innerHTML += `

                        <div class="application-card">

                            <div class="application-top">

                                <div>

                                    <h2>
                                        ${job
                        ? job.title
                        : "Job"
                    }
                                    </h2>

                                    <div class="company">

                                        ${
                        job
                            ? job.company
                            : "Company not available"
                    }

                                    </div>

                                </div>


                                <div class="job-icon">
                                    💼
                                </div>

                            </div>


                            <div class="details">

                                <div class="detail-row">

                                    <span class="detail-label">
                                        Location
                                    </span>

                                    <span class="detail-value">
                                        ${
                        job
                            ? job.location
                            : "N/A"
                    }
                                    </span>

                                </div>


                                <div class="detail-row">

                                    <span class="detail-label">
                                        Salary
                                    </span>

                                    <span class="detail-value">

                                        ${
                        job
                            ? "₹" + job.salary
                            : "N/A"
                    }

                                    </span>

                                </div>


                                <div class="detail-row">

                                    <span class="detail-label">
                                        Application ID
                                    </span>

                                    <span class="detail-value">
                                        #${application.id}
                                    </span>

                                </div>


                                <span class="status">

                                    ${application.status}

                                </span>

                            </div>

                        </div>

                    `;

                });

            })

            .catch(error => {

                document.getElementById(
                    "applications-container"
                ).innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Unable to Load Applications
                        </h2>

                        <p>
                            Please login again and try once more.
                        </p>

                        <a
                            href="/login"
                            class="browse-btn">

                            Go to Login

                        </a>

                    </div>

                `;

                console.error(
                    "Application error:",
                    error
                );

            });

    }


    // =========================
    // LOGOUT
    // =========================

    function logout() {

        fetch("/api/users/logout", {

            method: "POST"

        })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Logout failed");
                }

                return response.text();

            })

            .then(() => {

                localStorage.removeItem(
                    "loggedInUser"
                );

                alert(
                    "Logged out successfully!"
                );

                window.location.href =
                    "/login";

            })

            .catch(error => {

                console.error(
                    "Logout error:",
                    error
                );

                localStorage.removeItem(
                    "loggedInUser"
                );

                window.location.href =
                    "/login";

            });

    }

</script>


</body>

</html>
