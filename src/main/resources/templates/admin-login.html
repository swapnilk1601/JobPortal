<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - JobPortal</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 400px;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      color: #2563eb;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .user-login {
      text-align: center;
      margin-top: 25px;
    }

    .user-login a {
      color: #2563eb;
      text-decoration: none;
    }

  </style>

</head>

<body>

<div class="login-box">

  <div class="logo">
    JobPortal
  </div>

  <h2>Admin Login</h2>

  <p class="subtitle">
    Login to access the Admin Dashboard
  </p>

  <form onsubmit="adminLogin(event)">

    <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
    >

    <input
            type="password"
            id="password"
            placeholder="Password"
            required
    >

    <button type="submit">
      Admin Login
    </button>

  </form>

  <div class="user-login">
    <a href="/login">
      ← User Login
    </a>
  </div>

</div>


<script>

  function adminLogin(event) {

    event.preventDefault();

    const email =
            document.getElementById("email").value;

    const password =
            document.getElementById("password").value;

    const user = {
      email: email,
      password: password
    };


    fetch("/api/users/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(user)

    })

            .then(async response => {

              const text = await response.text();

              if (!response.ok) {
                throw new Error(text);
              }

              return JSON.parse(text);

            })

            .then(data => {

              if (data.role !== "ADMIN") {

                alert("Access denied. Admin account required.");

                return;
              }


              localStorage.setItem(
                      "loggedInUser",
                      JSON.stringify(data)
              );


              alert("Admin login successful! 🎉");

              window.location.href = "/admin";

            })

            .catch(error => {

              alert(
                      error.message ||
                      "Invalid admin email or password."
              );

              console.error(error);

            });

  }

</script>

</body>

</html>
